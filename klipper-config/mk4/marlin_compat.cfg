# ============================================================================
#  marlin_compat.cfg — MK4: comandos de Marlin que Klipper no trae de serie.
#
#  Cada macro hace lo equivalente en Klipper y dice en la consola cuál es el
#  comando nativo ("Klipper: ..."), para irlo aprendiendo. AYUDA_MARLIN imprime
#  la tabla completa. Klipper ya entiende sin cambios: G0/G1, G4, G28, G90/G91,
#  G92, M82/M83, M84/M18, M104/M109/M105, M106/M107, M112, M114, M115, M117,
#  M119, M204, M220/M221, M400, M20-M27 (SD). M907 está en macros.cfg.
#  Lo que se cambia aquí NO se guarda al reiniciar salvo lo que diga SAVE_CONFIG.
# ============================================================================

[gcode_macro _KLIPPER_TIP]
gcode:
  RESPOND MSG="Klipper: {params.MSG}"

# ---------------------------------------------------------------- Guardar / ver
[gcode_macro M500]
description: (Marlin) Guardar ajustes -> Klipper: SAVE_CONFIG
gcode:
  RESPOND MSG="M500: en Klipper no hay EEPROM. Las calibraciones (PID, sonda, malla, input shaper) se guardan con SAVE_CONFIG, que reinicia Klipper. El resto se edita en printer.cfg."
  _KLIPPER_TIP MSG="SAVE_CONFIG"

[gcode_macro M501]
description: (Marlin) Cargar ajustes guardados -> Klipper: FIRMWARE_RESTART
gcode:
  _KLIPPER_TIP MSG="los ajustes se leen de printer.cfg al arrancar: FIRMWARE_RESTART descarta los cambios en vivo"

[gcode_macro M502]
description: (Marlin) Valores de fábrica -> en Klipper: editar printer.cfg
gcode:
  _KLIPPER_TIP MSG="no hay valores de fábrica aparte: printer.cfg ES la configuración (se edita en Máquina -> printer.cfg)"

[gcode_macro M503]
description: (Marlin) Mostrar la configuración actual
gcode:
  {% set s = printer.configfile.settings %}
  {% set th = printer.toolhead %}
  {% set steps = [] %}
  {% for name, label in [('stepper_x', 'X'), ('stepper_y', 'Y'), ('stepper_z', 'Z'), ('extruder', 'E')] %}
    {% set rd = s[name].rotation_distance %}
    {% set _ = steps.append(label ~ '=' ~ (s[name].microsteps * 200 / rd)|round(2)) %}
  {% endfor %}
  RESPOND MSG="Pasos/mm (M92, de printer.cfg): {steps|join(' ')}"
  RESPOND MSG="Velocidad máx (M203): {th.max_velocity} mm/s · Aceleración (M201/M204): {th.max_accel} mm/s² · Esquinas (M205): {th.square_corner_velocity} mm/s"
  RESPOND MSG="PID hotend (M301): P={s.extruder.pid_kp} I={s.extruder.pid_ki} D={s.extruder.pid_kd}"
  RESPOND MSG="Pressure advance (M900): K={printer.extruder.pressure_advance}"
  {% set pr = s.accel_probe if "accel_probe" in s else s.probe %}
  RESPOND MSG="Sonda (M851, {"boquilla/ADXL" if "accel_probe" in s else "brazo manual"}): X={pr.x_offset} Y={pr.y_offset} Z={pr.z_offset}"
  RESPOND MSG="Malla (M420): {printer.bed_mesh.profile_name if printer.bed_mesh.profile_name else 'ninguna cargada'} · perfiles: {printer.bed_mesh.profiles.keys()|list|join(', ') or 'ninguno'}"
  {% if 'input_shaper' in s %}
    RESPOND MSG="Input shaper: X {s.input_shaper.shaper_type_x} {s.input_shaper.shaper_freq_x} Hz · Y {s.input_shaper.shaper_type_y} {s.input_shaper.shaper_freq_y} Hz"
  {% endif %}
  M907

# ---------------------------------------------------------------- Movimiento
[gcode_macro M17]
description: (Marlin) Activar motores -> Klipper: SET_STEPPER_ENABLE
gcode:
  {% for st in ['stepper_x', 'stepper_y', 'stepper_z', 'extruder'] %}
    SET_STEPPER_ENABLE STEPPER={st} ENABLE=1
  {% endfor %}
  _KLIPPER_TIP MSG="SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=1 (uno a uno)"

[gcode_macro M92]
description: (Marlin) Pasos/mm -> Klipper: rotation_distance
gcode:
  {% set ms = {'X': 'stepper_x', 'Y': 'stepper_y', 'Z': 'stepper_z', 'E': 'extruder'} %}
  {% for axis, name in ms.items() %}
    {% if axis in params %}
      {% set rd = (printer.configfile.settings[name].microsteps * 200 / params[axis]|float)|round(4) %}
      {% if axis == 'E' %}
        SET_EXTRUDER_ROTATION_DISTANCE EXTRUDER=extruder DISTANCE={rd}
        RESPOND MSG="E={params[axis]} pasos/mm -> rotation_distance {rd} aplicado (en vivo). Para que dure: rotation_distance: {rd} en [extruder] de printer.cfg"
      {% else %}
        RESPOND MSG="{axis}={params[axis]} pasos/mm -> pon rotation_distance: {rd} en [{name}] de printer.cfg y FIRMWARE_RESTART (no se cambia en vivo)"
      {% endif %}
    {% endif %}
  {% endfor %}
  {% if not params %}
    M503
  {% endif %}

[gcode_macro M201]
description: (Marlin) Aceleración máxima -> Klipper: SET_VELOCITY_LIMIT ACCEL=
gcode:
  {% set a = [params.X|default(0)|float, params.Y|default(0)|float]|max %}
  {% if a > 0 %}
    SET_VELOCITY_LIMIT ACCEL={a}
  {% endif %}
  _KLIPPER_TIP MSG="SET_VELOCITY_LIMIT ACCEL={a if a > 0 else 'valor'} (una sola aceleración para todos los ejes; Z va aparte en printer.cfg)"

[gcode_macro M203]
description: (Marlin) Velocidad máxima -> Klipper: SET_VELOCITY_LIMIT VELOCITY=
gcode:
  {% set v = [params.X|default(0)|float, params.Y|default(0)|float]|max %}
  {% if v > 0 %}
    SET_VELOCITY_LIMIT VELOCITY={v}
  {% endif %}
  _KLIPPER_TIP MSG="SET_VELOCITY_LIMIT VELOCITY={v if v > 0 else 'valor'} (mm/s, una para todos los ejes)"

[gcode_macro M205]
description: (Marlin) Jerk -> Klipper: SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=
gcode:
  {% if 'X' in params %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.X}
  {% endif %}
  _KLIPPER_TIP MSG="Klipper no usa jerk: el parecido es SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=5 (velocidad en esquinas a 90°)"

# ---------------------------------------------------------------- Sonda y nivelación
[gcode_macro G29]
description: (Marlin) Malla de la cama -> Klipper: BED_MESH_CALIBRATE
gcode:
  _KLIPPER_TIP MSG="BED_MESH_CALIBRATE, y luego BED_MESH_PROFILE SAVE=default + SAVE_CONFIG para guardarla"
  BED_MESH_CALIBRATE

[gcode_macro M420]
description: (Marlin) Activar/desactivar malla -> Klipper: BED_MESH_PROFILE LOAD= / BED_MESH_CLEAR
gcode:
  {% if params.S is defined and params.S|int == 0 %}
    BED_MESH_CLEAR
    _KLIPPER_TIP MSG="BED_MESH_CLEAR"
  {% elif params.S is defined %}
    BED_MESH_PROFILE LOAD=default
    _KLIPPER_TIP MSG="BED_MESH_PROFILE LOAD=default"
  {% endif %}
  {% if params.V is defined or not params %}
    BED_MESH_OUTPUT
  {% endif %}

[gcode_macro G35]
description: (Marlin) Asistente de tramado -> Klipper: SCREWS_TILT_CALCULATE
gcode:
  _KLIPPER_TIP MSG="SCREWS_TILT_CALCULATE (sin sonda: BED_SCREWS_ADJUST, como 'Level corners')"
  SCREWS_TILT_CALCULATE

[gcode_macro M851]
description: (Marlin) Offset de la sonda -> Klipper: PROBE_CALIBRATE
gcode:
  {% set cs = printer.configfile.settings %}
  {% set p = cs.accel_probe if "accel_probe" in cs else cs.probe %}
  RESPOND MSG="Offset de la sonda: X={p.x_offset} Y={p.y_offset} Z={p.z_offset}"
  {% if params.Z is defined %}
    RESPOND MSG="M851 Z no se aplica en vivo. Opción 1: PROBE_CALIBRATE (prueba del papel, ACCEPT, SAVE_CONFIG). Opción 2: ajusta con M290/babystep durante una impresión y luego Z_OFFSET_APPLY_PROBE + SAVE_CONFIG."
  {% endif %}

[gcode_macro G30]
description: (Marlin) Sondear un punto -> Klipper: PROBE (sonda manual: bajar antes el brazo y SONDA_LISTA)
gcode:
  {% if 'accel_probe' not in printer.configfile.settings and not printer["gcode_macro _SONDA"].deployed %}
    {action_raise_error("Baja el brazo de la sonda y ejecuta SONDA_LISTA antes de G30/PROBE")}
  {% endif %}
  PROBE
  _KLIPPER_TIP MSG="PROBE"

[gcode_macro M48]
description: (Marlin) Repetibilidad de la sonda -> Klipper: PROBE_ACCURACY
gcode:
  {% if 'accel_probe' not in printer.configfile.settings and not printer["gcode_macro _SONDA"].deployed %}
    {action_raise_error("Baja el brazo de la sonda y ejecuta SONDA_LISTA antes de M48/PROBE_ACCURACY")}
  {% endif %}
  PROBE_ACCURACY SAMPLES={params.P|default(10)}
  _KLIPPER_TIP MSG="PROBE_ACCURACY SAMPLES=10"

[gcode_macro M290]
description: (Marlin) Babystep Z -> Klipper: SET_GCODE_OFFSET Z_ADJUST= MOVE=1
gcode:
  {% if params.Z is defined %}
    SET_GCODE_OFFSET Z_ADJUST={params.Z} MOVE=1
  {% endif %}
  _KLIPPER_TIP MSG="SET_GCODE_OFFSET Z_ADJUST={params.Z|default('0.05')} MOVE=1 (o los botones +/- de Z-offset de la interfaz)"

# ---------------------------------------------------------------- Calibración
[gcode_macro M303]
description: (Marlin) Autotune PID -> Klipper: PID_CALIBRATE HEATER=extruder TARGET=
gcode:
  {% set t = params.S|default(210)|int %}
  _KLIPPER_TIP MSG="PID_CALIBRATE HEATER=extruder TARGET={t}, y al terminar SAVE_CONFIG"
  PID_CALIBRATE HEATER=extruder TARGET={t}

[gcode_macro M301]
description: (Marlin) Ver PID -> en Klipper se cambia con PID_CALIBRATE o en printer.cfg
gcode:
  {% set e = printer.configfile.settings.extruder %}
  RESPOND MSG="PID hotend: P={e.pid_kp} I={e.pid_ki} D={e.pid_kd}"
  _KLIPPER_TIP MSG="no se cambia en vivo: PID_CALIBRATE + SAVE_CONFIG, o editar pid_Kp/Ki/Kd en printer.cfg"

[gcode_macro M900]
description: (Marlin) Linear advance K -> Klipper: SET_PRESSURE_ADVANCE ADVANCE=
gcode:
  {% if params.K is defined %}
    SET_PRESSURE_ADVANCE ADVANCE={params.K}
  {% endif %}
  RESPOND MSG="Pressure advance: {params.K|default(printer.extruder.pressure_advance)}"
  _KLIPPER_TIP MSG="SET_PRESSURE_ADVANCE ADVANCE=0.08 (para que dure: pressure_advance en [extruder])"

# ---------------------------------------------------------------- Impresión
[gcode_macro M600]
description: (Marlin) Cambio de filamento -> Klipper: PAUSE, cambiar, RESUME
gcode:
  PAUSE
  RESPOND TYPE=command MSG="action:prompt_begin Cambio de filamento"
  RESPOND TYPE=command MSG="action:prompt_text Cambia el filamento (usa Extruir/Retraer de la interfaz) y pulsa Reanudar."
  RESPOND TYPE=command MSG="action:prompt_footer_button Reanudar|RESUME|primary"
  RESPOND TYPE=command MSG="action:prompt_show"
  _KLIPPER_TIP MSG="PAUSE ... RESUME"

[gcode_macro M108]
description: (Marlin) Continuar tras una espera -> sonda: SONDA_LISTA; impresión en pausa: RESUME
gcode:
  {% if printer["gcode_macro _SONDA"].pending > 0 %}
    SONDA_LISTA
    _KLIPPER_TIP MSG="SONDA_LISTA"
  {% elif printer.pause_resume.is_paused %}
    RESUME
    _KLIPPER_TIP MSG="RESUME"
  {% else %}
    RESPOND MSG="M108: no hay nada esperando"
  {% endif %}

# ---------------------------------------------------------------- Chuleta
[gcode_macro AYUDA_MARLIN]
description: Tabla de equivalencias Marlin -> Klipper
gcode:
  RESPOND MSG="== Iguales en Klipper: G0/G1 G4 G28 G90/G91 G92 M82/M83 M84 M104/M109/M105 M106/M107 M112 M114 M115 M117 M119 M204 M220/M221 M400 M907"
  RESPOND MSG="== Guardar: M500 -> SAVE_CONFIG (solo calibraciones; el resto en printer.cfg) · M503 -> M503 (resumen) · M501 -> FIRMWARE_RESTART"
  RESPOND MSG="== Movimiento: M92 -> rotation_distance · M201/M203 -> SET_VELOCITY_LIMIT ACCEL=/VELOCITY= · M205 -> SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY= · M17 -> SET_STEPPER_ENABLE"
  RESPOND MSG="== Sonda: G29 -> BED_MESH_CALIBRATE · M420 S1 -> BED_MESH_PROFILE LOAD=default · M851 -> PROBE_CALIBRATE · G30 -> PROBE · M48 -> PROBE_ACCURACY · M290 Z -> SET_GCODE_OFFSET Z_ADJUST= MOVE=1 · G35 -> SCREWS_TILT_CALCULATE · Level corners -> BED_SCREWS_ADJUST"
  RESPOND MSG="== Calibración: M303 -> PID_CALIBRATE HEATER=extruder TARGET= · M301 -> (ver M503) · M900 K -> SET_PRESSURE_ADVANCE ADVANCE= · input shaping -> SHAPER_CALIBRATE"
  RESPOND MSG="== Impresión: M600 -> PAUSE / RESUME · M108 -> SONDA_LISTA o RESUME · M112 (emergencia) -> luego FIRMWARE_RESTART"
  RESPOND MSG="== Solo Klipper: HELP (todos los comandos) · STATUS · GET_POSITION · QUERY_PROBE · ACCELEROMETER_QUERY · HOME_ACCEL · M503"
  RESPOND MSG="Referencia completa: https://www.klipper3d.org/G-Codes.html · Manual MK4: docs/13"
