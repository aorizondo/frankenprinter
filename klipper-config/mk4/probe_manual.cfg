# ============================================================================
#  probe_manual.cfg — Sonda Z: brazo basculante de despliegue MANUAL en el
#  conector Z_MAX (PB9). Polaridad verificada en Marlin: contacto = HIGH.
#  El flujo de despliegue/recogida está en macros.cfg (G28 y la malla lo piden).
#  Alternativa: probe_accel.cfg (la boquilla como sonda, con el ADXL).
#  Solo uno de los dos incluido en printer.cfg.
# ============================================================================
[probe]
pin: ^PB9                       # = Marlin Z_MIN_PROBE_PIN Z_MAX_PIN, PROBE_ENDSTOP_INVERTING false + pullup
x_offset: -12                   # M851 X-12
y_offset: -10                   # M851 Y-10
z_offset: 0.70                  # M851 Z-0.70 -> re-calibrar: PROBE_CALIBRATE
speed: 4
lift_speed: 10
samples: 3                      # sonda de baja calidad (MULTIPLE_PROBING 3)
sample_retract_dist: 2
samples_result: median
samples_tolerance: 0.05
samples_tolerance_retries: 3

# Tramado con la sonda (SCREWS_TILT_CALCULATE / G35). Coordenadas de BOQUILLA
# para que la sonda (X-12 Y-10) quede sobre cada tornillo = física + (12, 10).
# PROVISIONALES: ver tramado.cfg.
[screws_tilt_adjust]
screw1: 27, 25
screw1_name: delante-izq (referencia)
screw2: 187, 25
screw2_name: delante-der
screw3: 187, 235
screw3_name: detras-der
screw4: 27, 235
screw4_name: detras-izq
horizontal_move_z: 5
speed: 80
screw_thread: CW-M3              # si al girar como indica la distancia empeora: CCW-M3
