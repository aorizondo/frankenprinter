# ============================================================================
#  probe_accel.cfg — EXPERIMENTAL: la BOQUILLA es la sonda ("nozzle tap").
#  La cama sube hasta tocar la boquilla; el ADXL345 del cabezal nota el toque
#  en su eje Z y dispara INT1 (GPIO17), el mismo pin del homing X/Y.
#  Sustituye a probe_manual.cfg (solo uno de los dos incluido en printer.cfg).
#  Sin brazo que bajar: G28 y BED_MESH_CALIBRATE no muestran el diálogo.
#  Requiere extras/accel_probe.py enlazado en ~/klipper/klippy/extras/.
#  Puesta a punto paso a paso: docs/13 §7.5.
#
#  ⚠️ Boquilla LIMPIA (una gota de plástico falsea la medida): sondear con el
#  hotend a ~150 °C, o en frío tras limpiarla.
# ============================================================================
[accel_probe]
z_offset: 0.0                   # la boquilla toca: ~0. CALIBRAR con PROBE_CALIBRATE
threshold: 0.5                  # g en el eje Z del chip. CALIBRAR (docs/13 §7.5)
blank_time: 0.15                # s tras arrancar la subida antes de vigilar
settle_time: 0.3                # s de espera antes de cada toque (que se calme X/Y)
#z_current: 0.8                 # A en Z durante el sondeo (menos fuerza si no detecta); 1.2 normal
speed: 3                        # mm/s de subida de la cama al tocar
lift_speed: 10
samples: 3
sample_retract_dist: 1.5
samples_result: median
samples_tolerance: 0.05
samples_tolerance_retries: 3

# Si no detecta el toque, la cama empuja la boquilla hasta position_min:
# con la sonda en la boquilla no hace falta margen bajo cero.
[stepper_z]
position_min: -0.5
