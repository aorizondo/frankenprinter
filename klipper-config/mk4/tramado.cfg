# ============================================================================
#  tramado.cfg — Tramado (nivelación) de la cama con sus 4 tornillos M3.
#  Docs: docs/13 §4.1.
#
#  Dos métodos:
#   - SCREWS_TILT_CALCULATE (Marlin: G35): la sonda mide junto a cada tornillo
#     y dice cuánto girar ("00:15 CW" = un cuarto de vuelta en sentido horario).
#     Sus coordenadas dependen del offset de la sonda, así que el bloque
#     [screws_tilt_adjust] está en probe_manual.cfg y en probe_accel.cfg.
#   - BED_SCREWS_ADJUST (Marlin: "Level corners"): prueba del papel, la boquilla
#     va sobre cada tornillo a Z=0. No usa la sonda.
#
#  POSICIONES FÍSICAS de los tornillos (boquilla justo encima de cada uno).
#  PROVISIONALES: hasta medirlas, los comandos se niegan a ejecutarse.
#  Al medirlas, actualizar a la vez:
#    1. [bed_screws] (aquí):             = posición física
#    2. probe_manual.cfg [screws_tilt_adjust]: física + (12, 10)  (-offset de la sonda)
#    3. probe_accel.cfg  [screws_tilt_adjust]: = posición física (offset 0)
#    4. variable_listo: True  (aquí abajo)
# ============================================================================

[gcode_macro _TRAMADO]
variable_listo: False           # True cuando las coordenadas sean las reales
gcode:

[bed_screws]
screw1: 15, 15                  # PROVISIONAL
screw1_name: delante-izq
screw2: 175, 15                 # PROVISIONAL
screw2_name: delante-der
screw3: 175, 225                # PROVISIONAL
screw3_name: detras-der
screw4: 15, 225                 # PROVISIONAL
screw4_name: detras-izq
horizontal_move_z: 5
probe_height: 0
speed: 50
probe_speed: 5

[gcode_macro _TRAMADO_CHECK]
gcode:
  {% if not printer["gcode_macro _TRAMADO"].listo %}
    {action_raise_error("Tramado sin configurar: faltan las coordenadas reales de los 4 tornillos (tramado.cfg)")}
  {% endif %}
  {% set h = printer.toolhead.homed_axes %}
  {% if 'x' not in h or 'y' not in h or 'z' not in h %}
    {action_raise_error("Haz G28 antes del tramado")}
  {% endif %}

[gcode_macro SCREWS_TILT_CALCULATE]
rename_existing: _SCREWS_TILT_BASE
description: Tramado con la sonda: cuánto girar cada tornillo M3 (repetir hasta que todos den 00:00)
gcode:
  _TRAMADO_CHECK
  {% if 'accel_probe' in printer.configfile.settings %}
    _SCREWS_TILT_BASE {rawparams}
  {% elif printer["gcode_macro _SONDA"].deployed %}
    _SCREWS_TILT_BASE {rawparams}
    _SONDA_RECOGER
  {% else %}
    _SONDA_PEDIR ACCION=3
  {% endif %}

[gcode_macro BED_SCREWS_ADJUST]
rename_existing: _BED_SCREWS_ADJUST_BASE
description: Tramado con papel: la boquilla va a cada tornillo; ACCEPT / ADJUSTED / ABORT
gcode:
  _TRAMADO_CHECK
  {% if 'accel_probe' not in printer.configfile.settings and printer["gcode_macro _SONDA"].deployed %}
    {action_raise_error("Sube el brazo de la sonda (y SONDA_GUARDADA): chocaría con la cama a Z=0")}
  {% endif %}
  _BED_SCREWS_ADJUST_BASE
