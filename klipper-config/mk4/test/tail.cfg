[safe_z_home]
home_xy_position: 95, 120
z_hop: 5
z_hop_speed: 10
speed: 50
[bed_mesh]
speed: 80
horizontal_move_z: 5
mesh_min: 10, 10
mesh_max: 175, 225
probe_count: 3, 3
[force_move]
enable_force_move: True
[respond]
[display_status]
[pause_resume]
[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
  BASE_PAUSE
[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
  BASE_RESUME
[fake_accel cabezal]
[accel_endstop]
accel_chip: fake_accel cabezal
int_pin: rpi:gpio17
threshold_x: 3.0
threshold_y: 1.5
speed: 15
blank_time: 0.1
backoff: 5
retract: 3
overtravel: 6
[include macros.cfg]
[include marlin_compat.cfg]
