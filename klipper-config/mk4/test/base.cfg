[mcu]
serial: /dev/null
[mcu rpi]
serial: /tmp/klipper_host_mcu
[printer]
kinematics: cartesian
max_velocity: 150
max_accel: 2500
square_corner_velocity: 5.0
max_z_velocity: 15
max_z_accel: 100
[output_pin _vref_xy]
pin: gpio18
pwm: True
cycle_time: 0.01
scale: 1.986
value: 0.85
[output_pin _vref_z]
pin: gpio19
pwm: True
cycle_time: 0.01
scale: 1.986
value: 1.2
[output_pin _vref_e]
pin: gpio21
pwm: True
cycle_time: 0.01
scale: 1.986
value: 0.8
[stepper_x]
step_pin: gpio1
dir_pin: gpio2
enable_pin: !gpio3
microsteps: 16
rotation_distance: 42.667
endstop_pin: ^!gpio4
position_endstop: -40
position_min: -40
position_max: 310
homing_speed: 30
[stepper_y]
step_pin: gpio5
dir_pin: gpio6
enable_pin: !gpio3
microsteps: 16
rotation_distance: 42.667
endstop_pin: ^!gpio7
position_endstop: -60
position_min: -60
position_max: 320
homing_speed: 30
[stepper_z]
step_pin: gpio8
dir_pin: gpio9
enable_pin: !gpio3
microsteps: 16
rotation_distance: 5.2805
endstop_pin: probe:z_virtual_endstop
position_min: -2
position_max: 110
homing_speed: 5
second_homing_speed: 2
[extruder]
step_pin: gpio10
dir_pin: gpio11
enable_pin: !gpio12
microsteps: 16
rotation_distance: 3.0769
nozzle_diameter: 0.400
filament_diameter: 1.750
pressure_advance: 0.08
heater_pin: gpio13
sensor_type: EPCOS 100K B57560G104F
sensor_pin: analog0
control: pid
pid_Kp: 22.20
pid_Ki: 1.08
pid_Kd: 114.00
min_temp: 0
max_temp: 270
